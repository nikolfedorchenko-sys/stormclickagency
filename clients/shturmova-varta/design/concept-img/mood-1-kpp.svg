<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14233A"/><stop offset="1" stop-color="#0A1422"/></linearGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C9A35A" stop-opacity=".55"/><stop offset="1" stop-color="#C9A35A" stop-opacity="0"/></radialGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D3A0" stop-opacity=".45"/><stop offset="1" stop-color="#C9A35A" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
