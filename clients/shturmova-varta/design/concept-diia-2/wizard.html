<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замовлення охорони – Штурмова варта (концепція)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .hdr.solid { position: relative; }
  .w-band { position: relative; overflow: hidden; }
  .w-band .wrap { position: relative; z-index: 2; padding-top: 110px; padding-bottom: 48px; }
  .crumbs { font-size: 14px; display: flex; gap: 8px; }
  .crumbs a { text-underline-offset: 3px; }
  .w-band h1 { margin-top: 16px; font-size: var(--fs-h2); font-weight: 500; line-height: 1.05; letter-spacing: -.025em; }
  .w-layout { display: grid; grid-template-columns: 300px minmax(0, 680px); gap: 30px 110px; padding-top: 56px; padding-bottom: 120px; }
  .w-layout > aside { align-self: start; position: sticky; top: 24px; }
  .w-steps li { border-top: 2px solid #d4d4d4; padding: 14px 0 22px; }
  .w-steps li.now, .w-steps li.done { border-top-color: #000; }
  .w-steps button { all: unset; cursor: default; display: block; width: 100%; }
  .w-steps li.done button { cursor: pointer; }
  .w-steps small { display: block; font-size: 13px; color: var(--muted); }
  .w-steps b { display: block; margin-top: 4px; font-size: 18px; font-weight: 500; color: #8a8d92; }
  .w-steps li.now b, .w-steps li.done b { color: #000; }
  .w-steps em { display: block; margin-top: 4px; font-style: normal; font-size: 15px; color: var(--muted); }
  .w-steps li.done button:hover b { text-decoration: underline; text-underline-offset: 4px; }
  .w-call { margin-top: 24px; padding: 24px; background: var(--sky); }
  .w-call p { font-size: 15px; }
  .w-call a { display: inline-block; margin-top: 8px; font-size: 22px; font-weight: 500; text-decoration: none; letter-spacing: -.01em; }

  .w-meta { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); }
  .w-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .w-bar span { height: 3px; background: #d9d9d9; }
  .w-bar span.on { background: #000; }
  .w-q { margin-top: 40px; font-size: 40px; font-weight: 500; line-height: 1.1; letter-spacing: -.02em; }
  .w-sub { margin-top: 12px; color: #33363b; }
  .w-found { margin-top: 20px; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: var(--soft); }
  .opts { margin-top: 32px; border-bottom: 1px solid #000; }
  .opt { display: flex; align-items: center; gap: 18px; width: 100%; min-height: 72px; padding: 14px 16px 14px 4px; border: 0; border-top: 1px solid #000; background: none; text-align: left; cursor: pointer; transition: background .15s; }
  .opt:hover { background: #f4f4f1; }
  .opt .dot { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid #000; display: grid; place-items: center; }
  .opt[aria-checked="true"] .dot { background: #000; }
  .opt[aria-checked="true"] .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .opt[aria-checked="true"] { background: #f4f4f1; }
  .opt-t { font-size: 20px; font-weight: 500; line-height: 1.25; }
  .opt-s { display: block; margin-top: 2px; font-size: 15px; font-weight: 400; color: var(--muted); }
  .lbl { margin-top: 36px; font-size: 16px; font-weight: 500; }
  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #000; background: #fff; font-size: 16px; cursor: pointer; }
  .chip[aria-checked="true"] { background: #000; color: #fff; }
  .fld { display: block; margin-top: 28px; }
  .fld span { display: block; font-size: 16px; font-weight: 500; }
  .fld span i { font-style: normal; font-weight: 400; color: var(--muted); }
  .fld input { margin-top: 8px; width: 100%; height: 56px; border: 1.5px solid #6b6e73; border-radius: 12px; padding: 0 18px; font-size: 18px; background: #fff; outline: none; }
  .fld input:focus { border-color: #000; box-shadow: 0 0 0 1px #000; }
  .fine { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .w-nav { margin-top: 40px; display: flex; gap: 12px; }
  .w-nav .btn { min-height: 56px; padding: 0 40px; font-size: 17px; }
  .sum { margin-top: 32px; border-bottom: 1px solid #000; }
  .sum div { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid #000; }
  .sum dt { color: var(--muted); }
  .sum dd { font-weight: 500; }
  .done-mark { width: 64px; height: 64px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; }
  .done-mark .i { width: 30px; height: 30px; stroke-width: 2.4; }
  @media (max-width: 1100px) { .w-layout { grid-template-columns: 240px 1fr; gap: 30px 56px; } }
  @media (max-width: 900px) {
    .w-layout { grid-template-columns: 1fr; padding-top: 28px; padding-bottom: 72px; }
    .w-steps { display: none; }
    .w-aside-call { order: 2; }
  }
  @media (max-width: 640px) {
    .w-band .wrap { padding-top: 92px; padding-bottom: 28px; }
    .w-band h1 { font-size: 30px; margin-top: 10px; }
    .w-q { margin-top: 28px; font-size: 26px; }
    .opts { margin-top: 20px; }
    .opt { min-height: 64px; gap: 14px; }
    .opt-t { font-size: 17px; }
    .opt-s { font-size: 14px; }
    .w-nav { position: sticky; bottom: 0; margin: 28px calc(var(--gut) * -1) 0; padding: 12px var(--gut) calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid #e2e2e2; }
    .w-nav .btn { flex: 1; padding: 0 16px; min-height: 52px; }
    .w-nav .btn-ghost { flex: 0 0 auto; }
    .sum div { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

      <div class="hdr-right"><a class="hdr-phone" href="tel:+380675495710">+380 67 549 5710</a></div>
      <div class="hdr-mob">
        <a class="call-round" href="tel:+380675495710" aria-label="Подзвонити: +380 67 549 5710"><svg class="i"><use href="#i-phone"/></svg></a>

  <div class="wrap">
    <nav class="crumbs" aria-label="Шлях"><a href="index.html">Головна</a><span aria-hidden="true">/</span><span>Замовлення охорони</span></nav>
    <h1>Замовлення охорони</h1>

</div>

<main class="wrap w-layout">
  <aside>
    <ol class="w-steps" id="steps"></ol>
  </aside>
  <div>
    <div id="wiz" aria-live="polite"></div>

      <p>Не хочете заповнювати? Подзвоніть – оформимо заявку по телефону.</p>

</body>
</html>
